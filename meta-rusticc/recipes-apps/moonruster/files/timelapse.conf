# Rusticc: Moonruster's built-in timelapse (moonraker-timelapse's API, so
# Mainsail's timelapse tab works). Frames and videos live on /user-resource:
# /tmp is RAM.
[timelapse]
output_path: /user-resource/timelapse/
frame_path: /user-resource/.tmp/timelapse/
# No ffmpeg on the printer: every print's frames are kept as a zip in the
# timelapse folder, for the browser render (Mainsail: Timelapse Render)
saveframes: True
