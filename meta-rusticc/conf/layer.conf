# meta-rusticc: Rusticc on top of COSMOS (meta-opencentauri). It changes
# only what differs from COSMOS; everything else is COSMOS's.
BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/images/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-rusticc"
BBFILE_PATTERN_meta-rusticc = "^${LAYERDIR}/"
# (above meta-opencentauri's 6: our files shadow its)
BBFILE_PRIORITY_meta-rusticc = "7"

LAYERDEPENDS_meta-rusticc = "core meta-opencentauri"
LAYERSERIES_COMPAT_meta-rusticc = "scarthgap wrynose"
