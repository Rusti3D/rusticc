[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_y]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 200

[mcu]
serial: /dev/ttyACM0

[mcu bed]
serial: /dev/ttyS4

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

[load_cell_probe]
sensor_type: hx717s
dout_pins: bed:PB14
sclk_pins: bed:PB13
gain: B-64
reference_tare_counts: 71000
sensor_orientation: inverted
speed: 2.0
sample_retract_dist: 0.5
lift_speed: 10.0
counts_per_gram: 105
z_offset: 0.0
pullback_distance: 0.4
pullback_speed: 1.0
samples_tolerance: 0.05
samples_tolerance_retries: 3
